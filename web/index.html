<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SlopLint · 中文 AI 味检测</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --border: #e5e5ea;
      --accent: #5e5ce6;
      --low: #34c759;
      --medium: #ff9f0a;
      --high: #ff453a;
      --mark-bg: #fff3b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    header { margin-bottom: 32px; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .subtitle { color: var(--text-secondary); font-size: 15px; margin-top: 4px; }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.8;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--accent); }

    button {
      margin-top: 16px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }

    #result { margin-top: 32px; display: none; }

    .score-row { display: flex; align-items: baseline; gap: 16px; }
    .score {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }
    .score-unit { font-size: 20px; color: var(--text-secondary); }
    .badge {
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 999px;
      color: #fff;
    }
    .bar {
      margin-top: 12px;
      height: 8px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s; }

    .section-title {
      margin: 28px 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .highlighted {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      font-size: 16px;
      line-height: 2;
    }
    .highlighted mark {
      background: var(--mark-bg);
      padding: 1px 2px;
      border-radius: 3px;
      cursor: pointer;
    }

    .hit-list { list-style: none; }
    .hit-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .hit-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .hit-tag {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      color: #fff;
    }
    .hit-sentence { font-size: 13px; color: var(--text-secondary); }
    .hit-match { font-weight: 600; color: var(--text); }
    .hit-comment { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SlopLint</h1>
      <p class="subtitle">中文 AI 味检测器 · 粘贴文字，看它哪里像 AI 写的</p>
    </header>

    <textarea id="input" placeholder="粘贴你的文字，比如公众号草稿、小红书文案、论文段落…"></textarea>
    <button id="btn">检测 AI 味</button>

    <div id="result">
      <div class="score-row">
        <span class="score" id="score">0</span>
        <span class="score-unit">/ 100</span>
        <span class="badge" id="badge">低</span>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>

      <div class="section-title">原文里标红的地方</div>
      <div class="highlighted" id="highlighted"></div>

      <div class="section-title">这些地方像 AI 写的</div>
      <ul class="hit-list" id="hit-list"></ul>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
